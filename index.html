<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Search Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

body {
    font-family: 'Inter', sans-serif;
    margin: 0;
    padding: 20px;
    background: linear-gradient(135deg, #f0f4ff, #dbe4ff);
    color: #1f2937;
}

h1 {
    text-align: center;
    margin-bottom: 30px;
    color: #1e40ff;
    font-weight: 700;
}

/* Filters */
.search-box input {
    padding: 10px 15px;
    border-radius: 10px;
    border: 1px solid #1e40ff;
    font-size: 14px;
    transition: 0.3s;
}

.search-box input:focus {
    border-color: #1e40ff;
    box-shadow: 0 0 8px rgba(30,64,255,0.3);
}

/* Job Card */
.job-card {
    background: #ffffff;
    border-radius: 12px;
    padding: 12px 20px;
    display: grid;
    grid-template-columns: 2fr 2fr 3fr 1fr;
    align-items: center;
    gap: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    margin-bottom: 15px;
    transition: 0.3s;
}

.job-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}

/* Job info */
.job-title {
    font-weight: 600;
    color: #1e40ff;
}

.job-exp-location {
    font-size: 0.85rem;
    color: #374151;
    display: flex;
    gap: 40px; /* Increased space between experience and location */
}

/* Skills */
.skills span {
    background-color: #e0e7ff;
    color: #1e40ff;
    font-size: 0.75rem;
    padding: 2px 6px;
    border-radius: 6px;
    margin-right: 4px;
}

.apply-btn {
    padding: 5px 12px;
    font-size: 0.85rem;
    border-radius: 8px;
    background-color: #1e40ff;
    color: #ffffff;
    border: none;
    transition: 0.3s;
}

.apply-btn:hover {
    background-color: #1c3ed6;
}

@media(max-width:1024px){
    .job-card {
        grid-template-columns: 2fr 2fr 3fr 1fr;
        grid-template-rows: repeat(2, auto);
        row-gap: 5px;
    }
}

@media(max-width:768px){
    .job-card {
        grid-template-columns: 1fr;
        grid-template-rows: repeat(4, auto);
        row-gap: 8px;
    }
}
</style>
</head>
<body>

<div class="container">
    <h1>Job Search Portal</h1>

    <!-- Filters -->
    <div class="row g-2 mb-4 search-box">
        <div class="col-md">
            <input type="text" id="searchTitle" class="form-control" placeholder="Job Title">
        </div>
        <div class="col-md">
            <input type="text" id="searchExp" class="form-control" placeholder="Years of Experience">
        </div>
        <div class="col-md">
            <input type="text" id="searchLocation" class="form-control" placeholder="Location">
        </div>
        <div class="col-md">
            <input type="text" id="searchSkill" class="form-control" placeholder="Skills">
        </div>
    </div>

    <div id="jobsContainer"></div>
    <p class="text-center text-muted mt-4" id="noResults" style="display:none;">No matching jobs found</p>
</div>

<script>
const jobs = [
  {title:"urwhg", experience:"5+", location:"sjngu", skills:["jsng","sgv","jneg"], apply_link:"njsrgonjwiorj.com"},
  {title:"sojdhg", experience:"5 years", location:"skrnrgijo", skills:["jnegu","sjdgniu","jsng"], apply_link:"jnrhuwrogjpijewfp.com"},
  {title:"sojdhg", experience:"5 years", location:"skrnrgijo", skills:["jnegu","sjdgniu","jsng"], apply_link:"jnrhuwrogjpijewfp.com"},
  {title:"sojdhg", experience:"5 years", location:"skrnrgijo", skills:["jnegu","sjdgniu","jsng"], apply_link:"jnrhuwrogjpijewfp.com"},
  {title:"sojdhg", experience:"5 years", location:"skrnrgijo", skills:["jnegu","sjdgniu","jsng"], apply_link:"jnrhuwrogjpijewfp.com"}
];

const jobsContainer = document.getElementById('jobsContainer');
const noResults = document.getElementById('noResults');

function renderJobs(list){
    jobsContainer.innerHTML = '';
    if(list.length===0){ noResults.style.display='block'; return; }
    noResults.style.display='none';
    list.forEach(job=>{
        const row = document.createElement('div');
        row.className = 'job-card';
        row.dataset.title = job.title.toLowerCase();
        row.dataset.location = job.location.toLowerCase();
        row.dataset.skills = job.skills.join(' ').toLowerCase();
        row.dataset.exp = job.experience.toLowerCase();
        row.innerHTML = `
            <div class="job-title">${job.title}</div>
            <div class="job-exp-location"><span>${job.experience}</span><span>${job.location}</span></div>
            <div class="skills">${job.skills.map(s=>`<span>${s}</span>`).join('')}</div>
            <div><a href="${job.apply_link}" target="_blank" class="apply-btn">Apply</a></div>
        `;
        jobsContainer.appendChild(row);
    });
}

renderJobs(jobs);

const titleSearch = document.getElementById('searchTitle');
const expSearch = document.getElementById('searchExp');
const locationSearch = document.getElementById('searchLocation');
const skillSearch = document.getElementById('searchSkill');

function filterJobs(){
    const title = titleSearch.value.toLowerCase();
    const exp = expSearch.value.toLowerCase();
    const location = locationSearch.value.toLowerCase();
    const skill = skillSearch.value.toLowerCase();
    const filtered = jobs.filter(job=>{
        return job.title.toLowerCase().includes(title) &&
               job.experience.toLowerCase().includes(exp) &&
               job.location.toLowerCase().includes(location) &&
               job.skills.join(' ').toLowerCase().includes(skill);
    });
    renderJobs(filtered);
}

titleSearch.addEventListener('input', filterJobs);
expSearch.addEventListener('input', filterJobs);
locationSearch.addEventListener('input', filterJobs);
skillSearch.addEventListener('input', filterJobs);
</script>

</body>
</html>
